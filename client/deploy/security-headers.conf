# Security headers for the SHRI HEALTH client (included in each location,
# because nginx does not inherit add_header into a location that sets its own).
# `npm run package` fills in the inline script hash and writes
# security-headers.generated.conf. Documentation only: not applied anywhere.
#
# style-src needs 'unsafe-inline': the toast library injects its stylesheet
# at runtime. Scripts stay limited to this site plus the one inline theme
# script, identified by its hash.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' {{SCRIPT_HASHES}}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Enable once the whole domain is HTTPS-only (it cannot be undone quickly):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
